<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Employment Analytics Platform</title>
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar__brand">University Employment Analytics Platform</div>
        <nav class="topbar__nav" id="role-nav"></nav>
        <div class="topbar__user">
          <img class="avatar" src="assets/avatar.svg" alt="User Avatar" />
          <span class="user-name">root</span>
          <button class="button button--ghost button--sm" id="logout-btn" style="display:none;">Logout</button>
        </div>
      </header>
      <nav class="subnav" id="section-nav"></nav>
      <main class="app-content" id="app-root"></main>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
